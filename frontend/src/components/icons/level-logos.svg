  <!-- 20 财务之神 · 王冠 -->
  <symbol id="lvl-20" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#5B7CE6"/>
    <path d="M18 41l-2.5-16 10.5 7L32 20l6 12 10.5-7L46 41z" fill="#fff"/>
