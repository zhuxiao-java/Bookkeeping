    <rect width="64" height="64" rx="15" fill="#5B7CE6"/>
    <circle cx="32" cy="26" r="9" fill="none" stroke="#fff" stroke-width="3.4"/>
    <circle cx="32" cy="26" r="3" fill="#fff"/>
