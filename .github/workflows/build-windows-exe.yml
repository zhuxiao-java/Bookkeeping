name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

# 同一时间只保留最新一次构建，避免并发抢占 Runner
concurrency:
  group: build-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Checkout self-framework
        uses: actions/checkout@v4
        with:
          repository: zhuxiao-java/self-framework
          path: self-framework

      - name: Install self-framework into local Maven repo
        working-directory: self-framework
        run: mvn -B install -DskipTests

      - name: Build backend jar
        run: mvn -B clean package -DskipTests

      - name: Collect runtime dependencies
        shell: pwsh
        run: |
          mvn -B dependency:copy-dependencies "-DoutputDirectory=target/dist/libs" "-DincludeScope=runtime"
          Copy-Item target/bookkeeping-1.0-SNAPSHOT.jar target/dist/libs/

      - name: jlink minimal runtime
        run: >
          jlink --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.zipfs,jdk.localedata
          --strip-debug --no-man-pages --no-header-files --compress=2
          --output target/dist/runtime

      - name: jpackage app-image
        run: >
          jpackage --type app-image --name bookkeeping-backend --dest target/dist/app
          --input target/dist/libs --main-jar bookkeeping-1.0-SNAPSHOT.jar
          --main-class com.bookkeeping.BookkeepingApplication
          --java-options "-Xmx256m" --java-options "-Dfile.encoding=UTF-8"
          --runtime-image target/dist/runtime

      - name: Layout resources/java (Windows)
        shell: pwsh
        run: |
          # 清空后重新布局，避免混入其他平台产物（extraResources 会整体打进安装包）
          Remove-Item -Recurse -Force frontend/resources/java/* 2>$null
          New-Item -ItemType Directory -Force frontend/resources/java | Out-Null
          New-Item -ItemType File -Force frontend/resources/java/.gitkeep | Out-Null
          Copy-Item -Recurse -Force target/dist/app/bookkeeping-backend/* frontend/resources/java/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build renderer and NSIS installer
        working-directory: frontend
        run: |
          npm run build
          npx electron-builder --win --x64

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookkeeping-win-x64
          path: frontend/release/*.exe

      - name: Publish GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
