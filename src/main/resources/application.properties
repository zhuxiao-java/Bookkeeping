bookkeeping.dir = ./data
spring.datasource.url = jdbc:sqlite:${bookkeeping.dir}/accounts.db
spring.datasource.driver-class-name = org.sqlite.JDBC
spring.sql.init.mode = always
spring.sql.init.schema-locations = classpath:init.sql
# init.sql 均为幂等语句（CREATE ... IF NOT EXISTS / INSERT OR IGNORE / CREATE INDEX IF NOT EXISTS），
# 仅 ALTER TABLE ADD COLUMN 无法幂等，故开启容错使其重复执行时不中断启动。
spring.sql.init.continue-on-error = true
mybatis-plus.type-enums-package = com.bookkeeping.constant
mybatis-plus.mapper-locations = classpath*:/mapper/**/*.xml
#mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

