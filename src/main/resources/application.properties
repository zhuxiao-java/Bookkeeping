bookkeeping.dir = ./data
spring.datasource.url = jdbc:sqlite:${bookkeeping.dir}/accounts.db
spring.datasource.driver-class-name = org.sqlite.JDBC
spring.sql.init.mode = always
spring.sql.init.schema-locations = classpath:init.sql
# Windows 上 Java 17 默认字符集为 GBK，不显式指定会以乱码读入 UTF-8 脚本中的中文种子数据
spring.sql.init.encoding = UTF-8
# init.sql 均为幂等语句（CREATE ... IF NOT EXISTS / INSERT OR IGNORE / CREATE INDEX IF NOT EXISTS），
# 仅 ALTER TABLE ADD COLUMN 无法幂等，故开启容错使其重复执行时不中断启动。
spring.sql.init.continue-on-error = true
mybatis-plus.type-enums-package = com.bookkeeping.constant
mybatis-plus.mapper-locations = classpath*:/mapper/**/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 日志文件落盘到 bookkeeping.dir（logback 会自动创建父目录），按天 + 大小滚动
logging.file.name = ${bookkeeping.dir}/backend.log
logging.logback.rollingpolicy.max-file-size = 10MB
logging.logback.rollingpolicy.max-history = 7
logging.logback.rollingpolicy.total-size-cap = 200MB
