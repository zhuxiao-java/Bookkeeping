<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    等级 logo 唯一矢量源：20 个 symbol，id 为 lvl-1 .. lvl-20。
    段位配色（每 4 级一档）：青铜 #B7794B / 白银 #98A6B3 / 黄金 #E6A23C / 铂金 #4FB3A9 / 钻石 #5B7CE6。
    图形语义与等级名呼应：芽→币→星→尺→储→察→柱→罗→望→雪→衡→表→旗→箱→图→托→翼→舵→桂→冠。
    由 LevelLogo.vue 以 ?raw 注入页面后通过 <use> 引用；预览见 .level-logo-design（验证后删除）。
  -->

  <!-- 1 理财小白 · 新芽 -->
  <symbol id="lvl-1" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#B7794B"/>
    <path d="M32 47V31" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M32 33c0-7.5-6-12-12.5-12 0 7.5 6 12 12.5 12z" fill="#fff"/>
    <path d="M32 33c0-7.5 6-12 12.5-12 0 7.5-6 12-12.5 12z" fill="#fff"/>
  </symbol>

  <!-- 2 零钱管家 · 叠币 -->
  <symbol id="lvl-2" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#B7794B"/>
    <ellipse cx="32" cy="26" rx="12" ry="5" fill="none" stroke="#fff" stroke-width="3.4"/>
    <path d="M20 26v12c0 2.8 5.4 5 12 5s12-2.2 12-5V26" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M20 32c0 2.8 5.4 5 12 5s12-2.2 12-5" fill="none" stroke="#fff" stroke-width="3.4"/>
  </symbol>

  <!-- 3 记账新星 · 星 -->
  <symbol id="lvl-3" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#B7794B"/>
    <path d="M32 15l5 10.2 11.3 1.6-8.2 7.9 2 11.1L32 40.6l-10.1 5.2 2-11.1-8.2-7.9L27 25.2z" fill="#fff"/>
  </symbol>

  <!-- 4 预算学徒 · 刻度尺 -->
  <symbol id="lvl-4" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#B7794B"/>
    <rect x="16" y="26" width="32" height="13" rx="2.5" fill="none" stroke="#fff" stroke-width="3.4"/>
    <path d="M23 26v5.5M30 26v5.5M37 26v5.5M44 26v5.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </symbol>

  <!-- 5 省钱能手 · 存钱罐口 -->
  <symbol id="lvl-5" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#98A6B3"/>
    <circle cx="32" cy="37" r="11.5" fill="none" stroke="#fff" stroke-width="3.4"/>
    <rect x="27" y="30" width="10" height="3.6" rx="1.8" fill="#fff"/>
    <path d="M32 13v8m-3.4-3.4L32 21l3.4-3.4" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 6 精明消费者 · 放大镜审价 -->
  <symbol id="lvl-6" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#98A6B3"/>
    <circle cx="28.5" cy="28.5" r="10" fill="none" stroke="#fff" stroke-width="3.4"/>
    <circle cx="28.5" cy="28.5" r="3.4" fill="#fff"/>
    <path d="M36 36l10 10" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/>
  </symbol>

  <!-- 7 储蓄达人 · 增长柱 -->
