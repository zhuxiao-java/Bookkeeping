<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="节日贺卡">
  <defs>
    <linearGradient id="fsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c1121f"/>
      <stop offset="1" stop-color="#7a0d1b"/>
    </linearGradient>
    <radialGradient id="fsGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe066" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fsLantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f6b"/>
      <stop offset="1" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <rect width="800" height="360" fill="url(#fsBg)"/>

  <!-- 烟花 -->
  <g stroke-linecap="round">
    <circle cx="170" cy="90" r="46" fill="url(#fsGlow)"/>
    <g stroke="#ffe066" stroke-width="3">
      <line x1="170" y1="90" x2="170" y2="40"/>
      <line x1="170" y1="90" x2="170" y2="140"/>
      <line x1="170" y1="90" x2="120" y2="90"/>
      <line x1="170" y1="90" x2="220" y2="90"/>
      <line x1="170" y1="90" x2="135" y2="55"/>
      <line x1="170" y1="90" x2="205" y2="55"/>
      <line x1="170" y1="90" x2="135" y2="125"/>
      <line x1="170" y1="90" x2="205" y2="125"/>
    </g>
    <circle cx="640" cy="70" r="38" fill="url(#fsGlow)"/>
    <g stroke="#fff3b0" stroke-width="2.6">
      <line x1="640" y1="70" x2="640" y2="30"/>
      <line x1="640" y1="70" x2="640" y2="110"/>
      <line x1="640" y1="70" x2="600" y2="70"/>
      <line x1="640" y1="70" x2="680" y2="70"/>
      <line x1="640" y1="70" x2="612" y2="42"/>
      <line x1="640" y1="70" x2="668" y2="42"/>
      <line x1="640" y1="70" x2="612" y2="98"/>
      <line x1="640" y1="70" x2="668" y2="98"/>
    </g>
  </g>

  <!-- 星星点缀 -->
  <g fill="#ffe066" opacity="0.9">
    <circle cx="300" cy="55" r="3"/>
    <circle cx="500" cy="45" r="3.5"/>
    <circle cx="90" cy="180" r="3"/>
    <circle cx="720" cy="170" r="3"/>
    <circle cx="410" cy="80" r="2.5"/>
  </g>

  <!-- 灯笼 -->
  <g>
    <line x1="400" y1="96" x2="400" y2="126" stroke="#ffd166" stroke-width="3"/>
    <rect x="384" y="122" width="32" height="8" rx="4" fill="#ffd166"/>
    <ellipse cx="400" cy="176" rx="54" ry="48" fill="url(#fsLantern)"/>
    <g stroke="#ffd166" stroke-width="2" opacity="0.7">
      <line x1="356" y1="152" x2="444" y2="152"/>
      <line x1="348" y1="176" x2="452" y2="176"/>
      <line x1="356" y1="200" x2="444" y2="200"/>
    </g>
    <rect x="384" y="222" width="32" height="8" rx="4" fill="#ffd166"/>
    <path d="M392 230 q0 22 -6 34 M400 230 q0 26 0 40 M408 230 q0 22 6 34" stroke="#ffd166" stroke-width="2.5" fill="none"/>
  </g>

  <text x="400" y="316" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#ffe9c7" letter-spacing="8">节日快乐</text>
</svg>
