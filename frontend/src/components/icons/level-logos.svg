    <path d="M19 45c9 0 6-12 13-12s4-11 12-11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="5 4"/>
    <circle cx="19" cy="45" r="3.4" fill="#fff"/>
    <circle cx="44" cy="21" r="4.4" fill="none" stroke="#fff" stroke-width="3.2"/>
  </symbol>

  <!-- 16 金钱掌控者 · 财富之钥 -->
  <symbol id="lvl-16" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#4FB3A9"/>
