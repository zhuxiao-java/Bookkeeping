<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="生日贺卡">
  <defs>
    <linearGradient id="bdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbc2eb"/>
      <stop offset="1" stop-color="#a6c1ee"/>
    </linearGradient>
    <linearGradient id="bdCake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1f4"/>
      <stop offset="1" stop-color="#ffd3de"/>
    </linearGradient>
    <radialGradient id="bdFlame" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </radialGradient>
  </defs>

  <rect width="800" height="360" fill="url(#bdBg)"/>

  <!-- 五彩纸屑 -->
  <g opacity="0.85">
    <circle cx="90" cy="70" r="7" fill="#ffffff"/>
    <circle cx="150" cy="130" r="5" fill="#ffe066"/>
    <circle cx="700" cy="80" r="7" fill="#ffffff"/>
    <circle cx="640" cy="140" r="5" fill="#ff8fab"/>
    <circle cx="60" cy="220" r="5" fill="#ffe066"/>
    <circle cx="740" cy="240" r="6" fill="#ffffff"/>
    <rect x="120" y="60" width="10" height="10" rx="2" fill="#ff8fab" transform="rotate(20 125 65)"/>
    <rect x="670" y="180" width="10" height="10" rx="2" fill="#ffe066" transform="rotate(-15 675 185)"/>
  </g>

  <!-- 气球 -->
  <g>
    <ellipse cx="205" cy="120" rx="34" ry="42" fill="#ff8fab" opacity="0.9"/>
    <path d="M205 162 q6 40 -10 74" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
    <ellipse cx="600" cy="105" rx="30" ry="38" fill="#8ecae6" opacity="0.9"/>
    <path d="M600 143 q-6 40 8 70" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- 蛋糕 -->
  <g>
    <rect x="315" y="228" width="170" height="16" rx="8" fill="#e5989b"/>
    <rect x="328" y="196" width="144" height="40" rx="10" fill="url(#bdCake)"/>
    <rect x="328" y="196" width="144" height="12" rx="6" fill="#ffb3c6"/>
    <rect x="344" y="168" width="112" height="34" rx="10" fill="url(#bdCake)"/>
    <rect x="344" y="168" width="112" height="11" rx="5.5" fill="#ffb3c6"/>
    <!-- 蜡烛 -->
    <g>
      <rect x="374" y="140" width="7" height="30" rx="3" fill="#fff" stroke="#ffc2d1" stroke-width="1.5"/>
      <ellipse cx="377.5" cy="132" rx="6" ry="10" fill="url(#bdFlame)"/>
      <rect x="396" y="132" width="7" height="38" rx="3" fill="#fff" stroke="#ffc2d1" stroke-width="1.5"/>
      <ellipse cx="399.5" cy="124" rx="6" ry="10" fill="url(#bdFlame)"/>
      <rect x="418" y="140" width="7" height="30" rx="3" fill="#fff" stroke="#ffc2d1" stroke-width="1.5"/>
      <ellipse cx="421.5" cy="132" rx="6" ry="10" fill="url(#bdFlame)"/>
    </g>
  </g>

  <text x="400" y="308" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#7a4a63" letter-spacing="4">HAPPY BIRTHDAY</text>
</svg>
