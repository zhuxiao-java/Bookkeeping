    <path d="M39 39l4.5-4.5M44.5 44.5L49 40" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
  </symbol>

  <!-- 17 财务自由人 · 展翼 -->
  <symbol id="lvl-17" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#5B7CE6"/>
    <path d="M14 36c6.5-9 12.5-9 18 0 5.5-9 11.5-9 18 0" fill="none" stroke="#fff" stroke-width="3.8" stroke-linecap="round"/>
    <path d="M22 44c4-5 8-5 10 0 2-5 6-5 10 0" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  </symbol>

  <!-- 18 财富领航员 · 船舵 -->
  <symbol id="lvl-18" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="15" fill="#5B7CE6"/>
    <circle cx="32" cy="32" r="11.5" fill="none" stroke="#fff" stroke-width="3.4"/>
    <circle cx="32" cy="32" r="3.6" fill="#fff"/>
    <path d="M32 13v7.5M32 43.5V51M13 32h7.5M43.5 32H51" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
